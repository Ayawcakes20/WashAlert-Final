washalert:
  data:
    read-mode: ${DATA_READ_MODE:MYSQL}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
  mail:
    from: ${MAIL_FROM:jeyamaedacara815@gmail.com}
  otp:
    length: ${OTP_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:15}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  password-reset:
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://localhost:8080}}
  staff-invitation:
    frontend-base-url: ${STAFF_INVITATION_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://localhost:8080}}
    set-password-path: ${STAFF_INVITATION_SET_PASSWORD_PATH:/set-password}
    ttl-minutes: ${STAFF_INVITATION_TTL_MINUTES:60}
    token-bytes: ${STAFF_INVITATION_TOKEN_BYTES:32}
    cleanup:
      enabled: ${STAFF_INVITATION_CLEANUP_ENABLED:true}
      cron: ${STAFF_INVITATION_CLEANUP_CRON:0 */30 * * * *}
  booking:
    open-hour: ${BOOKING_OPEN_HOUR:7}
    close-hour: ${BOOKING_CLOSE_HOUR:22}
    slot-minutes: ${BOOKING_SLOT_MINUTES:90}
  payment:
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET:change-me}
      max-attempts: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:5}
      retry-delay-minutes: ${PAYMENT_WEBHOOK_RETRY_DELAY_MINUTES:5}
      retry-interval-ms: ${PAYMENT_WEBHOOK_RETRY_INTERVAL_MS:60000}
  paymongo:
    secret-key: ${PAYMONGO_SECRET_KEY:sk_test_r9z3bPB9Y6kUUd6DUazN8E1a}
    public-key: ${PAYMONGO_PUBLIC_KEY:pk_test_...}
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:change-me}
  notification:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    retry-delay-minutes: ${NOTIFICATION_RETRY_DELAY_MINUTES:2}
    process-interval-ms: ${NOTIFICATION_PROCESS_INTERVAL_MS:60000}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:washalert-b8ce8}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:./firebase-service-account.json}
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    backfill-on-startup: ${FIREBASE_BACKFILL_ON_STARTUP:false}
