server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        path: /
        same-site: lax
        secure: false
        http-only: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

washalert:

  gemini:
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  paymongo:
    secret-key: ${PAYMONGO_SECRET_KEY}
    public-key: ${PAYMONGO_PUBLIC_KEY}
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET}

  data:
    read-mode: ${DATA_READ_MODE:MYSQL}

  frontend-base-url: ${FRONTEND_BASE_URL:http://192.168.1.4:5173}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://192.168.1.4:5173,http://192.168.1.4:8080,http://192.168.1.4:8081,https://stimulant-bobcat-glare.ngrok-free.dev}

  mail:
    from: ${MAIL_FROM:WashAlert <noreply@washalert.local>}

  password-reset:
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://192.168.1.4:5173}}

  staff-invitation:
    frontend-base-url: ${STAFF_INVITATION_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://192.168.1.4:5173}}
    set-password-path: ${STAFF_INVITATION_SET_PASSWORD_PATH:/set-password}
    ttl-minutes: ${STAFF_INVITATION_TTL_MINUTES:60}
    token-bytes: ${STAFF_INVITATION_TOKEN_BYTES:32}
    cleanup:
      enabled: ${STAFF_INVITATION_CLEANUP_ENABLED:true}
      cron: ${STAFF_INVITATION_CLEANUP_CRON:0 */30 * * * *}

  booking:
    open-hour: ${BOOKING_OPEN_HOUR:7}
    close-hour: ${BOOKING_CLOSE_HOUR:22}
    slot-minutes: ${BOOKING_SLOT_MINUTES:90}

  payment:
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET}
      max-attempts: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:5}
      retry-delay-minutes: ${PAYMENT_WEBHOOK_RETRY_DELAY_MINUTES:5}
      retry-interval-ms: ${PAYMENT_WEBHOOK_RETRY_INTERVAL_MS:60000}

  notification:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    retry-delay-minutes: ${NOTIFICATION_RETRY_DELAY_MINUTES:2}
    process-interval-ms: ${NOTIFICATION_PROCESS_INTERVAL_MS:60000}

  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:washalert-b8ce8}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:./firebase-service-account.json}
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    backfill-on-startup: ${FIREBASE_BACKFILL_ON_STARTUP:false}
